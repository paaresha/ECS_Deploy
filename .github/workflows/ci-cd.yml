name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags:     [ 'v*.*.*' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [ dev, prod ]
      force_rollback:
        description: 'Force rollback of last deploy?'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION:      ${{ secrets.AWS_REGION }}
  ECR_REGISTRY:    ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
  ECR_REPOSITORY:  ${{ secrets.ECR_REPOSITORY }}
  IMAGE_TAG:       ${{ github.sha }}

concurrency:
  group:  ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: "🔍 Lint & Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Ruff – style / lint
        run: ruff check app/src/ --output-format=github

      - name: Mypy – type checking
        run: mypy app/src/ --ignore-missing-imports --strict-optional

      - name: Hadolint – Dockerfile linting
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: tfsec – Terraform security scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          soft_fail: true

  test:
    name: "🧪 Unit Tests & Coverage"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r app/src/requirements.txt
          pip install -r app/tests/requirements-test.txt

      - name: Run tests
        run: pytest --junitxml=test-results.xml
        env:
          ENVIRONMENT: test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
            coverage-html/
          retention-days: 30

      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          thresholds: '80 90'
          output: both

      - name: Add coverage comment to PR
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

  build:
    name: "🐳 Build & Push to ECR"
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    outputs:
      image: ${{ steps.build-image.outputs.image }}
      digest: ${{ steps.build-image.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag & push image
        id: build-image
        env:
          BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          TAGS="${IMAGE_URI}:${IMAGE_TAG} ${IMAGE_URI}:latest"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS} ${IMAGE_URI}:${VERSION}"
          fi

          docker buildx build \
            --platform linux/amd64 \
            --build-arg APP_VERSION="${IMAGE_TAG}" \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="${BUILD_DATE}" \
            --cache-from type=registry,ref=${IMAGE_URI}:buildcache \
            --cache-to   type=registry,ref=${IMAGE_URI}:buildcache,mode=max \
            $(for t in $TAGS; do echo "--tag $t"; done) \
            --push \
            --provenance=true \
            --sbom=true \
            .

          DIGEST=$(docker buildx imagetools inspect ${IMAGE_URI}:${IMAGE_TAG} \
                   --format '{{ .Manifest.Digest }}')

          echo "image=${IMAGE_URI}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "digest=${DIGEST}"                >> $GITHUB_OUTPUT

      - name: Save image URI for downstream jobs
        run: echo "${{ steps.build-image.outputs.image }}" > image-uri.txt

      - uses: actions/upload-artifact@v4
        with:
          name: image-uri
          path: image-uri.txt

  security-scan:
    name: "🛡️ Vulnerability Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:    ${{ needs.build.outputs.image }}
          format:       sarif
          output:       trivy-results.sarif
          severity:     CRITICAL,HIGH
          exit-code:    '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  deploy-dev:
    name: "🚀 Deploy → Dev"
    runs-on: ubuntu-latest
    needs: [ build, security-scan ]
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    environment:
      name: dev
      url:  ${{ steps.get-url.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Download image URI
        uses: actions/download-artifact@v4
        with:
          name: image-uri

      - name: Deploy to ECS Dev
        id: deploy
        run: |
          IMAGE_URI=$(cat image-uri.txt)

          TASK_DEF=$(aws ecs describe-task-definition \
                       --task-definition ${{ secrets.ECS_TASK_FAMILY }} \
                       --query 'taskDefinition' \
                       --output json)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE_URI" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status,
                 .requiresAttributes, .compatibilities,
                 .registeredAt, .registeredBy)')

          NEW_REVISION=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "new_revision=${NEW_REVISION}" >> $GITHUB_OUTPUT

          aws ecs update-service \
            --cluster  ${{ secrets.ECS_CLUSTER_DEV }} \
            --service  ${{ secrets.ECS_SERVICE_DEV }} \
            --task-definition "${NEW_REVISION}" \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster ${{ secrets.ECS_CLUSTER_DEV }} \
            --services ${{ secrets.ECS_SERVICE_DEV }}

      - name: Smoke test (dev)
        run: |
          DEV_URL=$(aws ecs describe-services \
            --cluster ${{ secrets.ECS_CLUSTER_DEV }} \
            --services ${{ secrets.ECS_SERVICE_DEV }} \
            --query 'services[0].loadBalancers[0].dnsName' \
            --output text 2>/dev/null || echo "")

          if [ -n "$DEV_URL" ]; then
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" http://${DEV_URL}/health || echo "000")
            echo "Health check status: $STATUS"
            [ "$STATUS" = "200" ] || { echo "Smoke test FAILED"; exit 1; }
          else
            echo "No ALB DNS found – skipping smoke test"
          fi

      - id: get-url
        run: |
          URL=$(aws ecs describe-services \
            --cluster ${{ secrets.ECS_CLUSTER_DEV }} \
            --services ${{ secrets.ECS_SERVICE_DEV }} \
            --query 'services[0].loadBalancers[0].dnsName' \
            --output text 2>/dev/null || echo "http://dev-environment")
          echo "url=http://${URL}" >> $GITHUB_OUTPUT
